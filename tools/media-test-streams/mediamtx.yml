# mediamtx config for the Basis media-player test stack.
# RTSP over TCP only (the player's rtspt:// lane). RTMP doubles as the
# publisher ingest and the player's rtmp:// pull lane.

logLevel: info

rtsp: yes
rtspTransports: [tcp]
rtspAddress: :8554

rtmp: yes
rtmpAddress: :1935

hls: no
webrtc: no
srt: no

paths:
  all_others:
