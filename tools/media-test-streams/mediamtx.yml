# mediamtx config for the Basis media-player test stack.
# RTSP with both transports: rtsp:// negotiates UDP first and falls back to
# TCP; rtspt:// pins TCP. Set rtspTransports: [tcp] to test the player's
# refusal fallback (UDP SETUP answered 461). RTMP doubles as the publisher
# ingest and the player's rtmp:// pull lane.

logLevel: info

rtsp: yes
rtspTransports: [udp, tcp]
rtspAddress: :8554
rtpAddress: :8000
rtcpAddress: :8001

rtmp: yes
rtmpAddress: :1935

hls: no
webrtc: no
srt: no

paths:
  all_others:
